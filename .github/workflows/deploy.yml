name: Deploy to DotNS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Force redeploy'
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write
  id-token: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build
        run: |
          bun install
          bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    uses: paritytech/dotns-sdk/.github/workflows/deploy.yml@main
    with:
      basename: tick-tack-toe
      artifact-name: site
      mode: production
      register-base: true
      skip-cache: ${{ inputs.skip-cache || false }}
      max-retries: 3
    secrets:
      dotns-mnemonic: ${{ secrets.DOTNS_MNEMONIC }}
