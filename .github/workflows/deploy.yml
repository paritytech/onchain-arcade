name: Deploy to DotNS

# Production: every push to master republishes onchain-arcade.paseo. Manual runs
# stay available because Bulletin content expires after ~2 weeks; a quiet period
# otherwise leaves the name pointing at content the chain no longer holds.
# For a branch deploy, use deploy-staging.yml.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel mid-publish: back-to-back merges queue instead.
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/deploy-dotns.yml
    with:
      domain: onchain-arcade.paseo
    secrets: inherit
